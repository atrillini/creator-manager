<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <title>CreatorCRM · offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #f5f5f7; color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        padding: 24px; box-sizing: border-box;
      }
      .card { max-width: 340px; background: #fff; border-radius: 24px; padding: 28px 24px; text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06); }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 16px 0 6px; }
      p { font-size: 14px; line-height: 1.5; color: #6b7280; margin: 0 0 20px; }
      button { font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: #111827; border: 0;
        border-radius: 999px; padding: 12px 22px; min-height: 44px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sei offline</h1>
      <p>CreatorCRM ha bisogno della connessione per mostrare dati aggiornati. Riprova appena torni online.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
